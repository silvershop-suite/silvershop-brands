---
Name: silvershop-brands-graphql
Only:
  moduleexists: 'silvershop-suite/api-graphql'
After:
  - '#graphql-schema-default'
---
# Registers this module's _graphql/ type fragment into the default schema — only when the GraphQL overlay is
# installed, so brands stays standalone. Adds Product.brand, which rides the REST BrandProductEnrichment.
SilverStripe\GraphQL\Schema\Schema:
  schemas:
    default:
      src:
        silvershop-brands: 'silvershop-suite/brands: _graphql'
